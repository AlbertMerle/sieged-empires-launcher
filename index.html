<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sieged Empires</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <img class="logo" src="../assets/icon.png" alt="Sieged Empires" />
        <h1>Sieged Empires</h1>
        <p class="tagline">Sign in, then press Play.</p>
      </header>

      <section class="panel">
        <div id="account-list" class="account-list"></div>
        <p id="user-line" class="user hidden"></p>

        <button id="btn-login" type="button" class="btn primary">Sign in with Microsoft</button>
        <button id="btn-login-browser" type="button" class="btn ghost">Sign in with browser</button>

        <div id="progress-wrap" class="progress-wrap hidden">
          <p id="progress-pct" class="progress-pct">0%</p>
          <div class="progress-track">
            <div id="progress-bar" class="progress-fill"></div>
          </div>
          <p id="progress-note" class="progress-note">Installing pack…</p>
        </div>

        <button id="btn-play" type="button" class="btn play">Play</button>
        <button id="btn-logout" type="button" class="btn ghost">Sign out</button>

        <p class="disclosure">Login stays on this computer only.</p>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
