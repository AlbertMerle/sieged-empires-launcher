# Multi-Platform Installer Builder
# Builds Linux (.deb), macOS (.dmg + .zip), and Windows (.msi)

name: Build All Installers

on:
  workflow_dispatch:

concurrency:
  group: build-all-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-linux-deb
          path: installer/linux/LinuxSetup/SiegedEmpires-*-linux.deb

  build-mac:
    name: macOS (.dmg + .zip)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - run: npm ci
      - env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - name: Ad-hoc sign + bundle launch helper
        run: |
          APP="MacOS/MacOSSetup/mac/Sieged Empires.app"
          if [ -d "$APP" ]; then
            codesign --force --deep --sign - "$APP" || true
            lipo -info "$APP/Contents/MacOS/Sieged Empires" || file "$APP/Contents/MacOS/Sieged Empires"
          fi
          chmod +x "MacOS/Launch Sieged Empires.command"
          for z in MacOS/MacOSSetup/SiegedEmpires-*-mac.zip; do
            [ -f "$z" ] && zip -j -u "$z" "MacOS/Launch Sieged Empires.command" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-mac-universal
          path: |
            installer/MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg
            installer/MacOS/MacOSSetup/SiegedEmpires-*-mac.zip

  build-windows:
    name: Windows (.msi)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-windows-msi
          path: installer/windows/WindowsSetup/Sieged-Empires-*-Windows.msi
