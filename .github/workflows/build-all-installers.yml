# Multi-Platform Installer Builder
# Builds Linux (.deb), macOS (.dmg + .zip), and Windows (.msi)

name: Build All Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-all-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-linux-deb
          path: linux/LinuxSetup/SiegedEmpires-*-linux.deb

  build-mac:
    name: macOS (.dmg + .zip)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-mac-universal
          path: |
            MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg
            MacOS/MacOSSetup/SiegedEmpires-*-mac.zip

  build-windows:
    name: Windows (.msi)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-windows-msi
          path: windows/WindowsSetup/Sieged-Empires-*-Windows.msi
