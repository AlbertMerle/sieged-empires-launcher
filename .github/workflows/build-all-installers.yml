# Multi-Platform Installer Builder
# Builds Linux (.deb), macOS (.dmg), and Windows (.msi)

name: Build All Installers

on:
  workflow_dispatch:

concurrency:
  group: build-all-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-linux-deb
          path: linux/LinuxSetup/SiegedEmpires-*-linux.deb

  build-mac:
    name: macOS (.dmg)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - name: Verify ad-hoc signing inside shipped DMG
        run: |
          DMG=$(ls MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg)
          MOUNT=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          APP="$MOUNT/Sieged Empires.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          echo "codesign verify: OK (app inside shipped DMG)"
          hdiutil detach "$MOUNT"
      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-mac-dmg
          path: MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg

  build-windows:
    name: Windows (.msi)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-windows-msi
          path: windows/WindowsSetup/Sieged-Empires-*-Windows.msi
