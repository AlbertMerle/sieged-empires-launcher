# Unsigned macOS Sieged Empires launcher (.dmg + .zip)
# Same universal pack as Linux — uses files/manifest.json

name: macOS unsigned installer

on:
  workflow_dispatch:

concurrency:
  group: macos-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: unsigned dmg + zip
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Package (unsigned, universal pack)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Checksums
        run: shasum -a 256 MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg MacOS/MacOSSetup/SiegedEmpires-*-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-mac-unsigned
          path: |
            MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg
            MacOS/MacOSSetup/SiegedEmpires-*-mac.zip
          retention-days: 14
          if-no-files-found: error
