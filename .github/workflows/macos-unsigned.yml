# macOS unsigned installer

name: macOS unsigned installer

on:
  workflow_dispatch:

concurrency:
  group: macos-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: universal dmg
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Package (unsigned universal dmg)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Ad-hoc sign app bundle
        run: |
          APP="MacOS/MacOSSetup/mac-universal/Sieged Empires.app"
          if [ ! -d "$APP" ]; then
            APP="MacOS/MacOSSetup/mac/Sieged Empires.app"
          fi
          if [ -d "$APP" ]; then
            chmod +x scripts/sign-mac-app.sh
            bash scripts/sign-mac-app.sh "$APP"
          fi

      - name: Checksums
        run: shasum -a 256 MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-mac-dmg
          path: MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg
          retention-days: 14
          if-no-files-found: error
