# macOS ad-hoc signed installer (identity "-" in setup-builder.json; sign happens before DMG)

name: macOS unsigned installer

on:
  workflow_dispatch:

concurrency:
  group: macos-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: universal dmg
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Package (ad-hoc signed universal dmg)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Verify ad-hoc signing inside shipped DMG
        run: |
          DMG=$(ls MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg)
          MOUNT=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          APP="$MOUNT/Sieged Empires.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          echo "codesign verify: OK (app inside shipped DMG)"
          hdiutil detach "$MOUNT"

      - name: Checksums
        run: shasum -a 256 MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-mac-dmg
          path: MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg
          retention-days: 14
          if-no-files-found: error
