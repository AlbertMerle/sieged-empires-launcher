# Copy this file to:  <repo>/.github/workflows/macos-unsigned.yml
# Requires the repo to include the installer/ tree (or adjust paths).
#
# Tools used (GitHub-hosted):
#   - actions/checkout
#   - actions/setup-node
#   - runs-on: macos-latest   ← real Mac VM; Linux cannot replace this
#   - electron-builder --mac (via npm run dist:mac)
#   - mac.identity: "-" (ad-hoc sign during pack, before DMG)
#   - CSC_IDENTITY_AUTO_DISCOVERY=false (do not pick up a real cert by accident)
#   - actions/upload-artifact
#
# Refs (community / electron-builder):
#   - identity: "-" + hardenedRuntime: false for ad-hoc friend builds
#   - identity: null skips signing entirely — do NOT use for release DMGs

name: macOS unsigned installer

on:
  workflow_dispatch:

concurrency:
  group: macos-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ad-hoc signed universal dmg
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Package (ad-hoc signed dmg)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Verify ad-hoc signing inside shipped DMG
        run: |
          DMG=$(ls MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg)
          MOUNT=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          APP="$MOUNT/Sieged Empires.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          echo "codesign verify: OK (app inside shipped DMG)"
          hdiutil detach "$MOUNT"

      - name: Checksums
        run: shasum -a 256 MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: sieged-empires-mac-dmg
          path: |
            installer/MacOS/MacOSSetup/SiegedEmpires-*-mac.dmg
          retention-days: 14
          if-no-files-found: error
